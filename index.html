<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#faf0e6" />
    <title>今天吃什么 - 美食抽卡</title>
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body>
    <section id="splash-screen" class="splash-screen" aria-label="今天呢开屏，点击进入" role="button" tabindex="0">
      <main class="splash" aria-label="今天呢开屏">
        <div class="orb orb--top" aria-hidden="true"></div>
        <div class="orb orb--left" aria-hidden="true"></div>
        <div class="orb orb--right" aria-hidden="true"></div>
        <svg class="linework linework--front" viewBox="0 0 100 177.78" preserveAspectRatio="none" aria-hidden="true">
          <path d="M -3,37 C 16,35 31,24 42,-4" />
          <path transform="translate(0 -0.8)" d="M 39,152 C 27,143 27,133 39,130 C 58,126 78,132 95,143 C 103,148 109,153 115,159" />
        </svg>
        <section class="brand">
          <img class="logo-image" src="assets/splash/todayni-logo-olive.png" alt="今天呢" />
          <p class="tagline">－ 今天，做点什么呢？ －</p>
        </section>
        <div class="strokes" aria-hidden="true"><i></i><i></i></div>
      </main>
    </section>
    <main id="app-viewport" class="app-viewport" aria-label="今天吃什么">
      <header class="header-section">
        <p class="status-pill"><span class="status-dot" aria-hidden="true"></span><span>TODAY'S SPECIAL</span></p>
        <h1 class="title">今天吃什么</h1>
        <p id="page-subtitle" class="subtitle">触碰卡牌或下方按钮开启抽选</p>
      </header>
      <section id="card-stage" class="card-stage" aria-label="今日美味卡牌">
        <button id="card-box" class="card-box" type="button" aria-label="抽取今日美味">
          <span class="card-face card-face-back">
            <span class="card-back-concave">
              <span class="card-back-icon" aria-hidden="true">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                  <path d="M4 14c0 4.4 3.6 8 8 8s8-3.6 8-8H4z" />
                  <path d="M8 6c0-1.5 1-2.5 1-3.5M12 7c0-1.5 1-2.5 1-3.5M16 6c0-1.5 1-2.5 1-3.5" />
                </svg>
              </span>
              <span class="card-back-text">TAP TO REVEAL</span>
            </span>
          </span>
          <span class="card-face card-face-front">
            <span class="food-card-header">
              <strong id="food-name" class="food-title">--</strong>
              <span id="food-tag" class="food-tag-pill">--</span>
            </span>
            <span id="illustration-stage" class="food-illustration-concave" aria-hidden="true"></span>
            <span id="food-desc" class="food-desc">--</span>
          </span>
        </button>
      </section>
      <section class="action-section">
        <button id="btn-draw" class="btn-neumorphism" type="button">
          <span class="btn-dot" aria-hidden="true"></span>
          <span id="btn-text">抽取今日美味</span>
        </button>
      </section>
    </main>
    <script type="module" src="scripts/app.js"></script>
  </body>
</html>
