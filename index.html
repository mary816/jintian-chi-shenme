<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" /><meta name="theme-color" content="#FBF8F1" /><title>今天呢 · 首页</title><link rel="stylesheet" href="styles/fonts.css" /><link rel="stylesheet" href="https://shogo82148.github.io/genjyuugothic-subsets/GenJyuuGothic-Regular/GenJyuuGothic-Regular.css" /><link rel="stylesheet" href="styles/app.css" /></head><body data-view="splash">
<main id="splash-screen" class="splash" aria-label="今天呢开屏，点击进入" role="button" tabindex="0"><section class="splash-copy"><img src="assets/splash/todayni-logo-olive.png" alt="今天呢" /><p>－ 今天，做点什么呢？ －</p></section><span class="splash-enter">轻触进入</span></main>
<main id="home-viewport" class="home-viewport" aria-label="今天呢首页">
  <section class="hero-wrap" aria-label="今天吃什么主视觉"><img class="top-banner-img" src="assets/home/top-banner-v1.png" alt="今天吃什么标题图，右下角有一只小鸟" /></section>
  <section class="home-intro"><h1>WHAT SHALL WE DO TODAY?</h1></section>
  <button class="primary-card" type="button" data-home-action="draw" aria-label="帮我决定今天吃什么">
    <span class="card-deck" aria-hidden="true"><span class="mini-card back"></span><span class="mini-card mid"></span><span class="mini-card front"><span class="menu-mark">✦</span><span class="menu-script">Today's<br />Menu</span></span></span>
    <span class="primary-copy"><span class="eyebrow">DAILY PICK</span><strong>帮我决定<br />今天吃什么</strong><small>抽一张卡，让干饭不再纠结</small></span>
    <span class="draw-pill"><span class="draw-label"><svg class="cutlery" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v7M8 3v7M11 3v7M8 10v11M5 3v3M8 3v3M11 3v3M16 3c3 2 3 6 0 8v10" /></svg><span>开始抽卡</span></span><b>→</b></span>
  </button>
  <nav class="secondary-grid" aria-label="后续功能"><button class="secondary-card" type="button" data-home-action="placeholder" data-home-notice="我的食谱正在整理中"><span class="symbol">☷</span><strong>我的食谱</strong><small>MY MENU</small></button><button class="secondary-card dark" type="button" data-home-action="placeholder" data-home-notice="地球 Online 即将开启"><span class="symbol">✦</span><strong>地球<br />Online</strong><small>即将开启</small></button></nav>
  <nav class="floating-tabbar" aria-label="底部导航"><button class="tab active" type="button" data-home-action="home"><i></i><span>首页</span></button><button class="tab" type="button" data-home-action="placeholder" data-home-notice="我的食谱正在整理中"><i></i><span>食谱</span></button><button class="tab" type="button" data-home-action="draw"><i></i><span>抽卡</span></button><button class="tab" type="button" data-home-action="placeholder" data-home-notice="我的功能正在准备中"><i></i><span>我的</span></button></nav>
  <div class="home-toast" id="home-toast" role="status" aria-live="polite"></div>
</main>
<main id="app-viewport" class="app-viewport" aria-label="今天吃什么"><header class="header-section"><p class="status-pill"><span class="status-dot" aria-hidden="true"></span><span>TODAY'S SPECIAL</span></p><h1 class="title">今天吃什么</h1><p id="page-subtitle" class="subtitle">触碰卡牌或下方按钮开启抽选</p></header><section id="card-stage" class="card-stage" aria-label="今日美味卡牌"><button id="card-box" class="card-box" type="button" aria-label="抽取今日美味"><span class="card-face card-face-back"><span class="card-back-concave"><span class="card-back-icon" aria-hidden="true"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M4 14c0 4.4 3.6 8 8 8s8-3.6 8-8H4z" /><path d="M8 6c0-1.5 1-2.5 1-3.5M12 7c0-1.5 1-2.5 1-3.5M16 6c0-1.5 1-2.5 1-3.5" /></svg></span><span class="card-back-text">TAP TO REVEAL</span></span></span><span class="card-face card-face-front"><span class="food-card-header"><strong id="food-name" class="food-title">--</strong><span id="food-tag" class="food-tag-pill">--</span></span><span id="illustration-stage" class="food-illustration-concave" aria-hidden="true"></span><span id="food-desc" class="food-desc">--</span></span></button></section><section class="action-section"><button id="btn-draw" class="btn-neumorphism" type="button"><span class="btn-dot" aria-hidden="true"></span><span id="btn-text">抽取今日美味</span></button></section></main><script type="module" src="scripts/app.js"></script></body></html>
